name: LanguageTool

on:
  - pull_request

jobs:
  languagetool:
    name: Check spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-languagetool@v1
        with:
          level: info
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-check
